name: Program update
description: Report an official rule change, closure, reopening, or factual correction
title: "[Update] "
labels: ["program-update"]
body:
  - type: input
    id: country
    attributes:
      label: Country or territory
    validations:
      required: true
  - type: input
    id: program
    attributes:
      label: Program name
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed?
      description: State the old rule, new rule, official publication and effective dates, and any transitional arrangements. Distinguish a factual correction from a policy change.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Competent authority or legal source URL
    validations:
      required: true
  - type: textarea
    id: review_scope
    attributes:
      label: Sources checked and review scope
      description: Record actual source access dates and which facts you checked here. Maintainers advance central review records only after full-page review; policy pages do not display site verification dates.
  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity check
      options:
        - label: This submission contains no affiliate, referral, or promotional link.
          required: true
        - label: I have not included personal application information.
          required: true
