name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - run: node scripts/validate-repo.mjs
      - run: node scripts/audit-freshness.mjs --check-public-status
      - run: node scripts/generate-site-config.mjs --check
      - run: node scripts/run-mkdocs.mjs build --strict --site-dir "$RUNNER_TEMP/site"
      - run: node scripts/validate-search.mjs "$RUNNER_TEMP/site"
