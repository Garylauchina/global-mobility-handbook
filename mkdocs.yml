# Generated by scripts/generate-site-config.mjs. Do not edit by hand.
# Build through scripts/run-mkdocs.mjs so the repository root remains the content root.
site_name: "全球身份与居留方案手册"
site_description: "以公开来源为基础的投资入籍、投资居留、留学、数字游民与退休居留中文知识库"
site_url: "https://garylauchina.github.io/global-mobility-handbook/"
repo_url: "https://github.com/Garylauchina/global-mobility-handbook"
repo_name: "Garylauchina/global-mobility-handbook"
edit_uri: "edit/main/"
docs_dir: "."
use_directory_urls: true
strict: true

theme:
  name: material
  language: zh
  font: false
  custom_dir: "site-overrides"
  icon:
    logo: material/earth
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search:
      lang:
        - zh
        - en
      jieba_dict_user: "assets/search/jieba-user.txt"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

exclude_docs: |
  .git/
  .github/
  .agents/
  .site/
  AGENTS.md
  site-overrides/
  scripts/
  mkdocs.yml
  requirements-docs.txt
  .gitignore

copyright: "原创内容采用 CC BY 4.0；请在付款或递件前向主管机关复核。"

